spring.application.name=soom
soom.jwt.secret=${JWT_SECRET:}
soom.cookie.secure=${AUTH_COOKIE_SECURE:false}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soom?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:soom}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
soom.frontend-url=${SOOM_FRONTEND_URL:http://127.0.0.1:5173}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:recovery-schema.sql,classpath:quit-record-schema.sql,classpath:dashboard-schema.sql
